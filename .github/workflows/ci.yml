name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Lint, Type Check, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Cap bumped 50 → 60 at S97 — 2-warning drift accumulated in pre-existing
        # tech-debt files (none introduced by current PR). 60 gives ~8 headroom
        # for short-term while the underlying unused-vars + missing-deps warnings
        # get cleaned up as a separate maintenance ticket.
        run: npx eslint . --max-warnings 60

      - name: User-table registry/lint sync (B9 B1)
        # Fails the build if eslint.config.mjs USER_OWNED_TABLES drifts from the
        # userScoped layer registry (DIRECT_USER_OWNED_TABLES + PARENT_JOIN_TABLES)
        # — drift is a silent IDOR surface or a false lint error.
        run: npx tsx scripts/check-user-table-registry-sync.mjs

      - name: Security-layer contract (B9 B1)
        # Mock-Supabase contract for the userScoped ownership layer: closure +
        # fail-closed + the parent-scoped child read/write primitives.
        run: npx tsx scripts/security-layer-contract.mjs

      - name: No-placeholder letters (dispute-letters v2 S3)
        # Fails the build if any rendered dispute letter — happy-path golden OR
        # adversarial-sparse render (null insurer/plan/account) — contains a literal
        # placeholder token ($[…] / [date] / [X] / [Word]), e.g. a `|| "[literal]"`
        # fallback leak. renderGated keeps the gated clauses fail-closed; this enforces it.
        run: npx tsx scripts/calibration/fixtures/dispute-grounds/no-placeholder.ts

      - name: Confirmed service ⇒ letter clause (S293 #6)
        # Locks the invariant: a service the needs panel presented as known and
        # the user confirmed CANNOT fail to produce its SUPPORTING DETAIL clause
        # — even on an itemized bill whose per-line EOB fields are all NULL
        # (the andrewullmanntest292 zero-clause regression, dispute 80a705ac).
        # Also: no dangling "Source: ." on citation-less confirmed benefits.
        run: npx tsx scripts/calibration/fixtures/dispute-grounds/confirmed-service-clause.ts

      - name: Guided Steps registry contract (S297)
        # Guided Steps v1 — step-id stability (persisted check-off keys), the
        # attest-only banned-phrase lint, autofill honesty (full ctx = no
        # placeholder holes; empty ctx = prep-chip path), the finding→clause
        # composer, suggestDoors, and KEY_RE/note-extension sync with BOTH
        # checklist routes.
        run: npx tsx scripts/calibration/fixtures/guided-steps/registry.ts

      - name: Script env target + write-ack (S313)
        # The two PURE decisions behind scripts/_env.ts: which database a URL
        # resolves to, and whether a write may proceed. Both are RUNTIME
        # behaviour no type can express — a refactor that inverted the
        # fail-closed UNKNOWN default would pass tsc and eslint while leaving
        # every PROD write unguarded. case-events-backfill.ts --write writes
        # real user history rows; the wrong database is not undoable.
        run: npx tsx scripts/calibration/fixtures/ops/script-env.ts

      - name: Plan-year authority (S313, mig 228)
        # A plan document is authority only for care delivered in its own year.
        # Locks the live defect (PROD claim 046f64cd: 2024 date of service pinned
        # to the member's 2026 plan quoted the 2026 SBC verbatim as authority),
        # and the property that makes it correct rather than blunt: the check is
        # on the CITATION's year, so a successful bill-year archive lookup still
        # cites. Without that third case, gating on the pinned plan instead would
        # pass every other assertion — the hole this rule already had once.
        run: npx tsx scripts/calibration/fixtures/dispute-grounds/plan-year-authority.ts

      - name: Money agreement across surfaces (S314)
        # The header's "Total Disputed" must equal the sum of the per-line
        # amounts the body prints; an unconfirmed match's projection must stay
        # OUT of the demand; and the claim page's ceiling must reconcile to the
        # letter's demand plus the open confirmations. Relationship assertions,
        # not literals — the S313 lesson that fixture assertions written from
        # what I expected a letter to say were wrong three commits running.
        run: npx tsx scripts/calibration/fixtures/dispute-grounds/money-agreement.ts

      - name: Case-timeline projector (S298 Phase 0, mig 221)
        # Timeline unification Phase 0 — the projector's parity contract
        # (stage / responseDueDate / sentLetterMeta reproduce today's surfaces;
        # letterType via the ONE shared resolver), §0.9 send→unsend→resend version
        # counts, dual concurrent waits, escalate-chain next-outranks-resolved,
        # the no-letter cases, stored∪virtual history dedupe, and the
        # synthesis exclusions (deadline_lapsed / followup_sent are cron-owned).
        run: npx tsx scripts/calibration/fixtures/case-timeline/projector.ts

      - name: Case-timeline rail composition fixture (S299 phase 1a)
        # The extension rail's contract — chronological numbering after 4b
        # (send steps at row birth, waits at latest send, primary send never
        # duplicated), stage→step-kind mapping via the stage machine, the
        # APPROVED copy verbatim (titles/chips/doors/whn incl. overdue +
        # day-grammar variants), dated-furniture-keys-on-deadlineType (the
        # sent+30d fallback is never asserted as a deadline), countdown %,
        # and the sole-active-wait default-open rule.
        run: npx tsx scripts/calibration/fixtures/case-timeline/rail-steps.ts

      - name: Letter sent-versions stack (S299 phase 2a / §0.9 rule 4)
        # Banking on mark-sent (double-submit idempotent), the §0.9b unsend
        # stamp (retained + labeled, latest un-unsent only, legacy no-op),
        # Case-2 resend (two artifacts, one step), defensive reads.
        run: npx tsx scripts/calibration/fixtures/dispute-grounds/sent-versions.ts

      - name: Prior-contact recital (S300 phase 2b / tracker Item N)
        # The ONE contact recital. Guards the false-statement cases first:
        # recipient matching (a provider letter never recites insurer-directed
        # sends as "I wrote to you"), §0.9b unsend netting (never-mailed is
        # never recited), the composing letter's own draft excluded, and the
        # other-track clause ONLY on an ATTESTED conclusion (absence of a
        # logged outcome is not evidence of silence). Also locks that the
        # `signoff` variant is byte-equal to the S297 call recital it absorbed.
        run: npx tsx scripts/calibration/fixtures/dispute-grounds/prior-contact.ts

      - name: Follow-up grouping + quieting (S300 phase 2b / §0.9c)
        # ONE CLAIM PER POINTER (distinct letter counts, soonest deadline,
        # claim-less rows dropped) + the rule that replaced the banner's
        # "Still waiting" button: a logged response RE-ANCHORS the check-in
        # chain instead of cancelling it, "no response yet" leaves it alone,
        # and deadline-anchored rows are never touched by an outcome.
        run: npx tsx scripts/calibration/fixtures/dispute-grounds/followup-quieting.ts

      - name: Letter needs — each letter asks only for what it prints (S301)
        # The full nine-type matrix: which address each letter mails to, which
        # track-varying rows it shows, and that the address it ASKS for is the
        # same gap the readiness floor SCORES. Locks the one-root defect family:
        # collector letters no longer asked for a provider address (#2/#3/#5),
        # external reviews asked for the appeals address they mail to (#4), and
        # the legacy `external_appeal` dispute_type no longer resolves to
        # "provider" through the shared recipient resolver. Also asserts the
        # carried-forward appeals-address confirm copy in BOTH provenances —
        # a value the user typed on another bill must never render as a Candid
        # verification with a date belonging to a different claim.
        run: npx tsx scripts/calibration/fixtures/dispute-grounds/letter-needs.ts
      - name: Bill totals source fixture (S302 line-items vs summary)
        run: npx tsx scripts/calibration/fixtures/cost-share-v2/totals-source.ts
      - name: Case File — no data no section, and nothing countable escapes (S305)
        # Three rules. (1) A section with nothing to say is omitted and the
        # numbering closes up behind it — a heading whose content is its own
        # emptiness is filler in a document a lawyer relies on. (2) Adjudication
        # is BANDED, never rated: past k-anon, "3 of 5 paid" beside a named code
        # and a named plan is still a small cell, and a percentage is no safer
        # because with a small sample the percentage IS the sub-count. (3) A
        # SOURCE guard over the two modules that build user-facing text, so a
        # sample size, a paid/total pair or a threshold cannot be re-added to a
        # letter or the Case File. The guard is deliberately not an output scan:
        # those values exist only when there IS community data, so a scan would
        # pass vacuously and stay green.
        run: npx tsx scripts/calibration/fixtures/legal/case-file.ts
      - name: Letter tracks — which parties a claim has evidence against (S304/S305)
        # Written at S304 and never wired in; registered here now that the rung
        # offer reads it. Locks the SILENCE cases first: `overcharge` — the
        # commonest finding — obligates nobody by design, and the insurer signal
        # is gated on recovery_cost_share_v2, so most claims must derive NO track
        # and the caller must fall back. Anything that makes empty rarer is a
        # regression until proven otherwise. Also locks routing by the CURATED
        # obligationElements[].party rather than the per-ground template default
        # (which misroutes three insurer findings to the provider), and that
        # every derived track resolves to a letter addressed to its own party.
        run: npx tsx scripts/calibration/fixtures/dispute-grounds/letter-tracks.ts
      - name: Draft live rebuild — a draft is a live document (S306 / UX-2)
        # Locks the pure halves of dispute_draft_live_rebuild_v1: the compose
        # extension is present-only (absent ≡ the legacy hash, so flag-off and
        # sent-letter fingerprints never move), a compose-only edit (provider
        # address, attested name) drifts the hash, blanks map to null so they
        # can never spuriously drift it, debounce 0 regenerates immediately
        # while sent letters still banner, and the mark-sent evidence-only
        # stamp guarantees the first post-unsend view rebuilds. The loader's
        # shape rule is DB-coupled — proven by the flag-ON E2E, not here.
        run: npx tsx scripts/calibration/fixtures/dispute-grounds/draft-live-rebuild.ts
      - name: Bill dedupe — the copy with your work on it wins (S307 / tracker AM)
        # Locks the S74 fingerprint rules byte-for-byte (composite primary,
        # doc-id fallback, id last-resort, cents rounding) AND the S307
        # case-aware representative selection: a duplicate upload must never
        # displace a claim carrying a live case (letters or guided-step
        # progress) from the list — the S304 Ballard incident. Ties keep
        # newest-wins; no id set passed ≡ legacy behavior exactly.
        run: npx tsx scripts/calibration/fixtures/claims/bill-dedupe.ts
      - name: Savings-math derivation — the panel explains itself (S307)
        # Locks the ONE derivation behind savings_math_derivation_v1: the plan
        # card's big number is the PRICED answer only (never a worst-case
        # ceiling headline, never a fabricated $0 best-case floor — the display
        # twin of the coalesce-unknown-to-0 bug, cf91a49e), the approved
        # per-line copy verbatim, You're-Owed / Off-your-balance result labels,
        # the spread sentence's provenance gate, the CTA's service-identity
        # precondition, and the banner tense fix. Dollars in = dollars out.
        run: npx tsx scripts/calibration/fixtures/claims/savings-derivation.ts
      - name: Classify sampling-fallback fixture (S320)
        # Locks the quick-classify degrade contract: pdf-lib page sampling is
        # an OCR-budget optimization and must NEVER gate an upload — a PDF the
        # pipeline's own reader (pdfjs) can parse fell to "Classification
        # failed" because the sampler threw on broken xref refs (S320 mobile
        # E2E, insurer-published SBC). Hostile PDFs degrade to full-document
        # classification with the page count taken from the OCR result.
        run: npx tsx scripts/calibration/fixtures/upload/classify-sampling-fallback.ts
      - name: Turnstile session-established fixture (S320)
        # Locks the one-check-per-session contract (turnstile_enforcement_v1
        # config: session_established_skip + session_established_ttl_minutes):
        # config parsing fails TOWARD challenging (garbage restores per-call
        # tokens, never widens acceptance) and establishment requires skip ON
        # + a real created_at inside the TTL (null/garbage/future = challenge).
        run: npx tsx scripts/calibration/fixtures/security/turnstile-session.ts

      - name: Canonical link is a pair (S292 / mig 218)
        # Fails the build if any code writes insurance_plans.canonical_plan_id
        # without canonical_match_confidence. An unscored link reads as UNKNOWN to
        # plan-identity.ts, so a half-write silently disables the resolver's two
        # strongest rules for that plan — nothing errors and nothing is logged.
        # Eight sites did exactly this before mig 218; the eighth hid inside a
        # shared object literal and matched no obvious grep.
        run: npx tsx scripts/canonical-link-pair-guard.mjs

      - name: Activation stamp guard (S319 mig 231)
        # Every writer that flips a plan active must stamp activated_at in the
        # same payload — the activation record is only as complete as its
        # writers, and a forgotten stamp silently starves every moved-on rule
        # (stranded Gate 4 today). Static scan, sibling of the pair-guard.
        run: node scripts/activation-stamp-guard.mjs

      - name: Plan identity + canonical confidence fixture (S292)
        # Ladder verdicts, the no-half-link builder contract, the side effects
        # findOrCreateCanonicalPlan must still perform after the read-only
        # matcher was extracted, and the merge policy (only `same` merges).
        run: npx tsx scripts/s292-canonical-link-confidence-fixture.ts

      - name: Merge receipt / unwind fixture (S292 4C)
        # The undo must never destroy a value the user corrected between the
        # merge and the click. Also covers: cells created by OTHER sources are
        # not deleted, a declined snapshot is flagged rather than partially
        # captured, and a second revert is a no-op.
        run: npx tsx scripts/s292-merge-receipt-fixture.ts

      - name: Canonical coverage completeness (S294 / mig 219)
        # The canonical read used to drop in_deductible_applies, so "No Charge
        # AFTER deductible" reached the engine as a flat $0. Locks: the mapper
        # carries the column, multi-variant slugs collapse deterministically
        # (no Postgres heap order), canonical GAP-FILLS under user rows instead
        # of replacing them, the metal-level ACA guess does NOT widen with
        # gap-fill (S154 confirmed-only), the letter refuses to assert an
        # expected cost it cannot ground, and a plan-stated term is surfaced as
        # an ANSWERED row that never blocks Done.
        run: npx tsx scripts/s294-canonical-coverage-fixture.ts

      - name: Plan-flow unification verbatim copy fixture (S289)
        # Asserts Andrew-approved plan-change copy VERBATIM, and was never wired
        # here. The cost: S316 rewrote OB_CARD_COPY.keptNothing (the card-mismatch
        # honesty rider) without updating its assertion, so this sat RED from S316
        # through the #297 merge and shipped to PROD — invisible, because nothing
        # ran it. Approved copy no test enforces is just a comment (the S308
        # letter-recovery lesson, red ~14 sessions for the same reason).
        # Offline: its only supabase reference is `import type`, erased at compile.
        # ⚠ 31 of 34 scripts/*fixture*.ts remain unwired. These two are the ones
        # S317 verified personally; auditing the rest is a logged follow-up, not
        # a blind bulk-add (some need credentials, and a red one added silently
        # teaches everyone to ignore the pipeline).
        run: npx tsx scripts/plan-flow-unification-fixture.ts

      - name: Simplified onboarding fixture (S285)
        # Its own step, not folded into the one above: `bash -e` aborts a
        # multi-command step at the first failure, which would hide this one's
        # result exactly when a copy change broke both. One fixture per step is
        # also this file's existing convention.
        # Offline: reads the committed 208 migration off disk; no network.
        run: npx tsx scripts/onboarding-simplified-fixture.ts

      - name: Borrow-gate fixture (S318)
        # The three-state money gate on secondary-coverage borrows
        # (resolveLinePrep): an undecided `estimate` borrow keeps its identity
        # but carries NO money (in + OON) — the service_cost assumption fires,
        # shouldOwe stays ungrounded, no letter asserts the dollar; a
        # user-CONFIRMED borrow flows in full; a user-REJECTED borrow drops
        # entirely (even a confident one); an ACA fallback outranks an
        # unconfirmed borrow with NO manufactured acaOverride; exact plan rows
        # never consult the marks; malformed metadata fails closed. The letter
        # cap reads this same derivation, and the cap is the one surface the
        # user cannot see (the S318 launch gate).
        # Offline: constructs prep/ctx in memory; pure imports; no network.
        run: npx tsx scripts/s318-borrow-gate-fixture.ts

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Provide dummy env vars so build doesn't fail on missing secrets
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_FIREBASE_API_KEY: placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: placeholder
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: placeholder
          RESEND_API_KEY: re_placeholder
          QSTASH_TOKEN: placeholder
          ANTHROPIC_API_KEY: placeholder
          SLACK_WEBHOOK_URL: https://placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ADMIN_PASSWORD: placeholder

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
